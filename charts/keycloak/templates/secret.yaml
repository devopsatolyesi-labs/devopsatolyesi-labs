{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.existingSecret | quote }}
  namespace: identity-system
type: Opaque
stringData:
  postgres-password: {{ required "postgres.password must be supplied via an external secret or --set-string" .Values.postgres.password | quote }}
  admin-password: {{ required "admin.password must be supplied via an external secret or --set-string" .Values.admin.password | quote }}
  realm-admin-password: {{ required "users.admin.password must be supplied" .Values.users.admin.password | quote }}
  devops-password: {{ required "users.devops.password must be supplied" .Values.users.devops.password | quote }}
  kubernetes-password: {{ required "users.kubernetes.password must be supplied" .Values.users.kubernetes.password | quote }}
{{- end }}
