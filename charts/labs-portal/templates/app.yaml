apiVersion: v1
kind: Service
metadata:
  name: labs-portal
  namespace: labs-system
spec:
  selector:
    app.kubernetes.io/name: labs-portal
  ports:
    - name: http
      port: {{ .Values.servicePort }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: labs-portal
  namespace: labs-system
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: labs-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: labs-portal
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: portal
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: labs-portal
  namespace: labs-system
spec:
  ingressClassName: {{ .Values.ingressClassName | quote }}
  rules:
    - host: {{ .Values.hostname | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: labs-portal
                port:
                  name: http
