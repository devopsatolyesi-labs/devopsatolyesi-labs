site_name: DevOps Atölyesi - Eğitim Portalı
site_description: DevOps Practitioner ve Cloud Native Eğitim Platformu Laboratuvar ve Müfredat Portalı
site_author: DevOps Atölyesi
site_url: https://labs.devopsatolyesi.com

theme:
  name: material
  language: tr
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Karanlık moda geç
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Aydınlık moda geç

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: false

extra:
  generator: false

extra_css:
  - stylesheets/image-lightbox.css?v=20260905-3

extra_javascript:
  - javascripts/course_access.js?v=20260905-1
  - javascripts/image-lightbox.js?v=20260905-3
  - javascripts/open_in_new_tab.js?v=20260905-1

