map $http_x_auth_request_groups $portal_course {
    default denied;
    ~*admins admin;
    ~*devops-practitioner-5-day devops;
    ~*docker-kubernetes-2-day kubernetes;
}

map "$portal_course:$uri" $portal_allowed {
    default 0;
    ~^admin: 1;
    ~^(?:devops|kubernetes):/(?:$|index\.html$|404\.html$|assets/|javascripts/|stylesheets/|favicon) 1;
    ~^devops:/day[1-5]/LAB- 1;
    ~^devops:/lab-assets/[A-Za-z0-9._-]+/images/ 1;
    ~^kubernetes:/day1/LAB-DOC-(?:01-docker-first-container|02-docker-volumes-env)(?:/|\.html)?$ 1;
    ~^kubernetes:/day2/LAB-DOC-(?:03-dockerfile-optimization|05-docker-compose-multitier)(?:/|\.html)?$ 1;
    ~^kubernetes:/day4/LAB-K8S-(?:01-kind-pods-deployments|02-services-config-secrets|03-production-workloads)(?:/|\.html)?$ 1;
    ~^kubernetes:/lab-assets/LAB-DOC-03/images/ 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;

    location ~ /\. {
        deny all;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /_auth/me {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"course":"$portal_course"}';
    }

    location / {
        if ($portal_allowed = 0) { return 403; }
        try_files $uri $uri/ /index.html;
    }
}
