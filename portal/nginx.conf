map $http_x_auth_request_groups $portal_course {
    default denied;
    ~*(?:admins|admin) admin;
    ~*(?:devops-practitioner-5-day|devops-practitioner|devops) devops;
    ~*(?:docker-kubernetes-2-day|docker-kubernetes|kubernetes|docker) kubernetes;
}

map "$portal_course:$uri" $portal_allowed {
    default 0;
    ~^admin: 1;
    ~^(?:devops|kubernetes):/(?:$|index\.html$|404\.html$|assets/|javascripts/|stylesheets/|favicon|search/|sitemap|robots\.txt) 1;

    # DevOps role (5-day comprehensive course): full access to all topic families
    ~^devops:/(?:setup|curriculum|projects|troubleshooting|reference|linux|git|docker|jenkins|gitlab|terraform|kubernetes|helm|gitops|monitoring|logging|incident|capstone)(?:/|$) 1;
    ~^devops:/day[1-5]/LAB-[A-Za-z0-9_-]+(?:/|\.html)?$ 1;
    ~^devops:/(?:day[1-5]|linux|git|docker|jenkins|gitlab|terraform|kubernetes|helm|gitops|monitoring|logging|incident|capstone|projects)/images/ 1;
    ~^devops:/lab-assets/[A-Za-z0-9._-]+/images/ 1;
    ~^devops:/downloads/LAB-[A-Za-z0-9_-]+\.zip$ 1;

    # Kubernetes / Docker role (2-day focused course): strictly Docker and Kubernetes
    ~^kubernetes:/reference(?:/|$) 1;
    ~^kubernetes:/curriculum/(?:02_2_DAY_DOCKER_KUBERNETES|02_LAB_CATALOG_INDEX|06_DEMO_APPLICATION_MAPPING)(?:/|\.html)?$ 1;
    ~^kubernetes:/setup(?:/|$|/index\.html$|/docker-engine|/kind-cluster|/kubeadm-cluster|/kubeconfig-management|/nfs-storageclass|/docker-kubernetes)(?:/|\.html)?$ 1;
    ~^kubernetes:/(?:docker|kubernetes)(?:/|$) 1;
    ~^kubernetes:/day[12]/LAB-DOC-[A-Za-z0-9_-]+(?:/|\.html)?$ 1;
    ~^kubernetes:/day4/LAB-K8S-[A-Za-z0-9_-]+(?:/|\.html)?$ 1;
    ~^kubernetes:/(?:docker|kubernetes|day[124])/images/ 1;
    ~^kubernetes:/lab-assets/LAB-(?:DOC|K8S)-[A-Za-z0-9._-]+/images/ 1;
    ~^kubernetes:/downloads/LAB-(?:DOC|K8S)-[A-Za-z0-9_-]+\.zip$ 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;

    location ~ /\. {
        deny all;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /_auth/me {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"course":"$portal_course"}';
    }

    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        if ($portal_allowed = 0) { return 404; }
        expires 1h;
        add_header Cache-Control "public, no-transform" always;
    }

    # Automatically redirect any .md requests to the clean directory URL
    location ~ ^(?<path>.+)\.md$ {
        return 301 $path/;
    }

    # 301 Redirects from legacy day-based URLs to canonical topic URLs
    location ~* ^/day1/(LAB-LNX-[^/]+)/?$ { return 301 /linux/$1/; }
    location ~* ^/day1/(LAB-GIT-[^/]+)/?$ { return 301 /git/$1/; }
    location ~* ^/day[12]/(LAB-DOC-[^/]+)/?$ { return 301 /docker/$1/; }
    location ~* ^/day3/(LAB-JEN-[^/]+)/?$ { return 301 /jenkins/$1/; }
    location ~* ^/day3/(LAB-GLB-[^/]+)/?$ { return 301 /gitlab/$1/; }
    location ~* ^/day3/(LAB-GHA-[^/]+)/?$ { return 301 /gitlab/$1/; }
    location ~* ^/day3/(LAB-TF-[^/]+)/?$ { return 301 /terraform/$1/; }
    location ~* ^/day4/(LAB-K8S-[^/]+)/?$ { return 301 /kubernetes/$1/; }
    location ~* ^/day4/(LAB-HLM-[^/]+)/?$ { return 301 /helm/$1/; }
    location ~* ^/day4/(LAB-ARG-[^/]+)/?$ { return 301 /gitops/$1/; }
    location ~* ^/day5/(LAB-MON-[^/]+)/?$ { return 301 /monitoring/$1/; }
    location ~* ^/day5/(LAB-LOG-[^/]+)/?$ { return 301 /logging/$1/; }
    location ~* ^/day5/(LAB-INC-[^/]+)/?$ { return 301 /incident/$1/; }
    location ~* ^/day5/(LAB-CAP-[^/]+)/?$ { return 301 /capstone/$1/; }

    # Legacy URL redirects for reordered Docker labs
    location = /docker/LAB-DOC-09-docker-networks-dns/ { return 301 /docker/LAB-DOC-06-docker-networks-dns/; }
    location = /docker/LAB-DOC-03-dockerfile-optimization/ { return 301 /docker/LAB-DOC-08-dockerfile-optimization/; }
    location = /docker/LAB-DOC-04-docker-multistage-hardening/ { return 301 /docker/LAB-DOC-09-docker-multistage/; }
    location = /docker/LAB-DOC-07-docker-java-spring-boot/ { return 301 /docker/LAB-DOC-11-docker-java-spring-boot/; }
    location = /docker/LAB-DOC-08-docker-react-nginx/ { return 301 /docker/LAB-DOC-12-docker-react-nginx/; }
    location = /docker/LAB-DOC-05-docker-compose-multitier/ { return 301 /docker/LAB-DOC-13-docker-compose-multitier/; }
    location = /docker/LAB-DOC-06-trivy-harbor-integration/ { return 301 /docker/LAB-DOC-16-trivy-harbor-integration/; }
    location = /docker/LAB-DOC-10-docker-backup-restore/ { return 301 /docker/LAB-DOC-17-docker-backup-restore/; }
    location = /docker/LAB-DOC-13-docker-compose-production-patterns/ { return 301 /docker/LAB-DOC-19-docker-compose-production-patterns/; }

    # Legacy URL redirects for Kubernetes labs
    location = /kubernetes/LAB-K8S-01-kind-pods-deployments/ { return 301 /kubernetes/LAB-K8S-01-kind-cluster-kubectl/; }
    location = /kubernetes/LAB-K8S-02-services-config-secrets/ { return 301 /kubernetes/LAB-K8S-05-service-dns/; }
    location = /kubernetes/LAB-K8S-03-production-workloads/ { return 301 /kubernetes/LAB-K8S-07-probes-resources/; }

    # Legacy URL redirects for Jenkins labs
    location = /jenkins/LAB-JNK-01-jenkins-declarative-pipeline/ { return 301 /jenkins/LAB-JEN-05-declarative-pipeline/; }
    location = /jenkins/LAB-JNK-02-jenkins-secure-pipeline/ { return 301 /jenkins/LAB-JEN-15-devsecops-capstone/; }

    error_page 404 /404.html;

    location / {
        if ($portal_allowed = 0) { return 302 /; }
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
