map $http_x_auth_request_groups $portal_course {
    default denied;
    ~*admins admin;
    ~*devops-practitioner-5-day devops;
    ~*docker-kubernetes-2-day kubernetes;
}

map "$portal_course:$uri" $portal_allowed {
    default 0;
    ~^admin: 1;
    ~^(?:devops|kubernetes):/(?:$|index\.html$|404\.html$|assets/|javascripts/|stylesheets/|favicon) 1;
    ~^(?:devops|kubernetes):/setup/ 1;
    ~^devops:/day1/LAB-(?:LNX-(?:01-linux-preflight|02-nginx-letsencrypt-ssl|03-ssh-tunnel-mysql)|GIT-01-git-workflow|DOC-(?:01-docker-first-container|02-docker-volumes-env))(?:/|\.html)?$ 1;
    ~^devops:/day2/LAB-DOC-(?:03-dockerfile-optimization|04-docker-multistage-hardening|05-docker-compose-multitier|06-trivy-harbor-integration|07-docker-java-spring-boot|08-docker-react-nginx|09-docker-networks-dns|10-docker-backup-restore|13-docker-compose-production-patterns)(?:/|\.html)?$ 1;
    ~^devops:/day3/LAB-(?:JNK-(?:01-jenkins-declarative-pipeline|02-jenkins-secure-pipeline)|GLB-01-gitlab-ci-pipeline|GHA-01-github-actions-ci|TF-(?:01-terraform-docker-provider|04-terraform-helm-centralized-monitoring|08-terraform-aws-vpc-architecture))(?:/|\.html)?$ 1;
    ~^devops:/day4/LAB-(?:K8S-(?:01-kind-pods-deployments|02-services-config-secrets|03-production-workloads)|HLM-01-helm-chart-deployment|ARG-01-argocd-gitops-sync)(?:/|\.html)?$ 1;
    ~^devops:/day5/LAB-(?:MON-(?:01-prometheus-grafana-metrics|02-alertmanager-rules)|LOG-(?:01-centralized-logging|02-elk-centralized-logging)|INC-01-k8s-crashloop-postmortem|CAP-01-end-to-end-devops)(?:/|\.html)?$ 1;
    ~^devops:/lab-assets/[A-Za-z0-9._-]+/images/ 1;
    ~^devops:/downloads/LAB-(?:LNX-(?:01|02|03)|GIT-01|DOC-(?:01|02|03|04|05|06|07|08|09|10|13)|JNK-(?:01|02)|GLB-01|GHA-01|TF-(?:01|04|08)|K8S-(?:01|02|03)|HLM-01|ARG-01|MON-(?:01|02)|LOG-(?:01|02)|INC-01|CAP-01)\.zip$ 1;
    ~^kubernetes:/day1/LAB-DOC-(?:01-docker-first-container|02-docker-volumes-env)(?:/|\.html)?$ 1;
    ~^kubernetes:/day2/LAB-DOC-(?:03-dockerfile-optimization|05-docker-compose-multitier|08-docker-react-nginx|09-docker-networks-dns|10-docker-backup-restore)(?:/|\.html)?$ 1;
    ~^kubernetes:/day4/LAB-K8S-(?:01-kind-pods-deployments|02-services-config-secrets|03-production-workloads)(?:/|\.html)?$ 1;
    ~^kubernetes:/lab-assets/[A-Za-z0-9._-]+/images/ 1;
    ~^kubernetes:/downloads/LAB-(?:DOC-(?:01|02|03|05|08|09|10)|K8S-(?:01|02|03))\.zip$ 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;

    location ~ /\. {
        deny all;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /_auth/me {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"course":"$portal_course"}';
    }

    location / {
        if ($portal_allowed = 0) { return 403; }
        try_files $uri $uri/ /index.html;
    }
}
