map $http_x_auth_request_groups $portal_course {
    default denied;
    ~*(?:admins|admin) admin;
    ~*(?:devops-practitioner-5-day|devops-practitioner|devops) devops;
    ~*(?:docker-kubernetes-2-day|docker-kubernetes|kubernetes|docker) kubernetes;
}

map "$portal_course:$uri" $portal_allowed {
    default 0;
    ~^admin: 1;
    ~^(?:devops|kubernetes):/(?:$|index\.html$|404\.html$|assets/|javascripts/|stylesheets/|favicon|search/|sitemap|robots\.txt) 1;
    ~^(?:devops|kubernetes):/(?:setup/|curriculum/|troubleshooting/|reference/) 1;
    ~^devops:/projects/ 1;
    ~^devops:/day1/LAB-(?:LNX-(?:01-linux-preflight|02-nginx-letsencrypt-ssl|03-ssh-tunnel-mysql)|GIT-01-git-workflow|DOC-[0-9]+)(?:/|\.html)?$ 1;
    ~^devops:/day2/LAB-DOC-[0-9]+(?:/|\.html)?$ 1;
    ~^devops:/day3/LAB-(?:JNK-(?:01-jenkins-declarative-pipeline|02-jenkins-secure-pipeline)|GLB-01-gitlab-ci-pipeline|GHA-01-github-actions-ci|TF-(?:01-terraform-docker-provider|04-terraform-helm-centralized-monitoring|08-terraform-aws-vpc-architecture))(?:/|\.html)?$ 1;
    ~^devops:/day4/LAB-(?:K8S-(?:01-kind-pods-deployments|02-services-config-secrets|03-production-workloads)|HLM-01-helm-chart-deployment|ARG-01-argocd-gitops-sync)(?:/|\.html)?$ 1;
    ~^devops:/day5/LAB-(?:MON-(?:01-prometheus-grafana-metrics|02-alertmanager-rules)|LOG-(?:01-centralized-logging|02-elk-centralized-logging)|INC-01-k8s-crashloop-postmortem|CAP-01-end-to-end-devops)(?:/|\.html)?$ 1;
    ~^devops:/lab-assets/[A-Za-z0-9._-]+/images/ 1;
    ~^devops:/downloads/LAB-(?:LNX-(?:01|02|03)|GIT-01|DOC-[0-9]+|JNK-(?:01|02)|GLB-01|GHA-01|TF-(?:01|04|08)|K8S-(?:01|02|03)|HLM-01|ARG-01|MON-(?:01|02)|LOG-(?:01|02)|INC-01|CAP-01)\.zip$ 1;
    ~^kubernetes:/day[12]/LAB-DOC-[0-9]+(?:/|\.html)?$ 1;
    ~^kubernetes:/day4/LAB-K8S-(?:01-kind-pods-deployments|02-services-config-secrets|03-production-workloads)(?:/|\.html)?$ 1;
    ~^kubernetes:/lab-assets/[A-Za-z0-9._-]+/images/ 1;
    ~^kubernetes:/downloads/LAB-(?:DOC-[0-9]+|K8S-(?:01|02|03))\.zip$ 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;

    location ~ /\. {
        deny all;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /_auth/me {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"course":"$portal_course"}';
    }

    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        if ($portal_allowed = 0) { return 403; }
        expires 1h;
        add_header Cache-Control "public, no-transform" always;
    }

    # Automatically redirect any .md requests to the clean directory URL
    location ~ ^(?<path>.+)\.md$ {
        return 301 $path/;
    }

    # Legacy URL redirects for reordered Docker labs
    location = /day2/LAB-DOC-09-docker-networks-dns/ { return 301 /day2/LAB-DOC-06-docker-networks-dns/; }
    location = /day2/LAB-DOC-03-dockerfile-optimization/ { return 301 /day2/LAB-DOC-08-dockerfile-optimization/; }
    location = /day2/LAB-DOC-04-docker-multistage-hardening/ { return 301 /day2/LAB-DOC-09-docker-multistage/; }
    location = /day2/LAB-DOC-07-docker-java-spring-boot/ { return 301 /day2/LAB-DOC-11-docker-java-spring-boot/; }
    location = /day2/LAB-DOC-08-docker-react-nginx/ { return 301 /day2/LAB-DOC-12-docker-react-nginx/; }
    location = /day2/LAB-DOC-05-docker-compose-multitier/ { return 301 /day2/LAB-DOC-13-docker-compose-multitier/; }
    location = /day2/LAB-DOC-06-trivy-harbor-integration/ { return 301 /day2/LAB-DOC-16-trivy-harbor-integration/; }
    location = /day2/LAB-DOC-10-docker-backup-restore/ { return 301 /day2/LAB-DOC-17-docker-backup-restore/; }
    location = /day2/LAB-DOC-13-docker-compose-production-patterns/ { return 301 /day2/LAB-DOC-19-docker-compose-production-patterns/; }

    error_page 404 /404.html;

    location / {
        if ($portal_allowed = 0) { return 403; }
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
