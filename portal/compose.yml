name: devops-atolyesi-portal

services:
  portal:
    build:
      context: ..
      dockerfile: portal/Dockerfile
    image: devopsatolyesi/training-portal:latest
    container_name: training-portal
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
