<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 260" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
  </defs>
  
  <text x="30" y="36" fill="#f8fafc" font-size="18" font-weight="700">LAB-JNK-DOC — Jenkins Docker Containerization Architecture</text>
  <text x="30" y="58" fill="#64748b" font-size="12">Jenkins Agent Docker Socket (/var/run/docker.sock) Multi-Stage Image Build</text>
  
    <!-- Stage: Stage 1: SCM -->
    <g>
      <rect x="30" y="80" width="200" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="30" y="80" width="200" height="42" rx="10" fill="url(#grad-blue)"/>
      <rect x="30" y="112" width="200" height="10" fill="url(#grad-blue)"/>
      <text x="44" y="106" fill="#ffffff" font-size="14" font-weight="700">Stage 1: SCM</text>
      <text x="218" y="106" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="end">Jenkinsfile</text>
      
      <rect x="38" y="132" width="184" height="62" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="46" y="154" fill="#f8fafc" font-size="13" font-weight="600">Checkout</text>
      <rect x="155" y="142" width="65" height="18" rx="9" fill="#1e3a8a"/>
        <text x="188" y="154" fill="#60a5fa" font-size="10" font-weight="600" text-anchor="middle">SCM</text>
      <text x="46" y="168" fill="#94a3b8" font-size="11">Git Source Code</text>
      
        
    </g>
    
  <path d="M 230 155 L 260 155" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  
    <!-- Stage: Stage 2: Test -->
    <g>
      <rect x="260" y="80" width="200" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="260" y="80" width="200" height="42" rx="10" fill="url(#grad-green)"/>
      <rect x="260" y="112" width="200" height="10" fill="url(#grad-green)"/>
      <text x="274" y="106" fill="#ffffff" font-size="14" font-weight="700">Stage 2: Test</text>
      <text x="448" y="106" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="end">target: test</text>
      
      <rect x="268" y="132" width="184" height="62" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="276" y="154" fill="#f8fafc" font-size="13" font-weight="600">pytest suite</text>
      <rect x="385" y="142" width="65" height="18" rx="9" fill="#064e3b"/>
        <text x="418" y="154" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">PASS</text>
      <text x="276" y="168" fill="#94a3b8" font-size="11">Isolated in Container</text>
      
        
    </g>
    
  <path d="M 460 155 L 490 155" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  
    <!-- Stage: Stage 3: Prod Build -->
    <g>
      <rect x="490" y="80" width="200" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="490" y="80" width="200" height="42" rx="10" fill="url(#grad-blue)"/>
      <rect x="490" y="112" width="200" height="10" fill="url(#grad-blue)"/>
      <text x="504" y="106" fill="#ffffff" font-size="14" font-weight="700">Stage 3: Prod Build</text>
      <text x="678" y="106" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="end">target: runtime</text>
      
      <rect x="498" y="132" width="184" height="62" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="506" y="154" fill="#f8fafc" font-size="13" font-weight="600">Hardened Image</text>
      <rect x="615" y="142" width="65" height="18" rx="9" fill="#1e3a8a"/>
        <text x="648" y="154" fill="#60a5fa" font-size="10" font-weight="600" text-anchor="middle">IMAGE</text>
      <text x="506" y="168" fill="#94a3b8" font-size="11">Non-root UID 10001</text>
      
        
    </g>
    
  <path d="M 690 155 L 720 155" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  
    <!-- Stage: Stage 4: Tagging -->
    <g>
      <rect x="720" y="80" width="190" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="720" y="80" width="190" height="42" rx="10" fill="url(#grad-purple)"/>
      <rect x="720" y="112" width="190" height="10" fill="url(#grad-purple)"/>
      <text x="734" y="106" fill="#ffffff" font-size="14" font-weight="700">Stage 4: Tagging</text>
      <text x="898" y="106" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="end">Version Tag</text>
      
      <rect x="728" y="132" width="174" height="62" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="736" y="154" fill="#f8fafc" font-size="13" font-weight="600">docker tag</text>
      <rect x="835" y="142" width="65" height="18" rx="9" fill="#3b0764"/>
        <text x="868" y="154" fill="#c084fc" font-size="10" font-weight="600" text-anchor="middle">READY</text>
      <text x="736" y="168" fill="#94a3b8" font-size="11">python-lab:v1</text>
      
        
    </g>
    
    
</svg>