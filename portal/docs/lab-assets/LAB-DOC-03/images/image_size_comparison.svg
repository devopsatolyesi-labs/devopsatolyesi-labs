<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="360">
  <defs>
    <linearGradient id="bgComp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="barRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="barAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="barGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadowBox" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="360" rx="14" fill="url(#bgComp)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="18" letter-spacing="0.5">DOCKER IMAGE MINIMIZATION BENCHMARK</text>
  <text x="450" y="58" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12">Anti-Pattern Bloated Dockerfile vs. Optimized Slim vs. Multi-Stage Alpine</text>

  <!-- Benchmark Bar 1: Anti-Pattern -->
  <g transform="translate(40, 85)">
    <text x="0" y="16" fill="#fca5a5" font-family="sans-serif" font-weight="700" font-size="13">1. Anti-Pattern (Bloated Dockerfile)</text>
    <text x="0" y="32" fill="#94a3b8" font-family="sans-serif" font-size="11">FROM python:3.11 + gcc/build-essential + apt cache + no .dockerignore</text>
    
    <!-- Bar Background -->
    <rect x="0" y="42" width="700" height="32" rx="6" fill="#1e293b"/>
    <!-- Filled Bar (100% = 700px) -->
    <rect x="0" y="42" width="700" height="32" rx="6" fill="url(#barRed)"/>
    <text x="715" y="63" fill="#f87171" font-family="monospace" font-weight="800" font-size="15">1.28 GB</text>
  </g>

  <!-- Benchmark Bar 2: Slim & Cleaned -->
  <g transform="translate(40, 175)">
    <text x="0" y="16" fill="#fcd34d" font-family="sans-serif" font-weight="700" font-size="13">2. Single-Stage Optimized (Slim Base &amp; Layer Caching)</text>
    <text x="0" y="32" fill="#94a3b8" font-family="sans-serif" font-size="11">FROM python:3.11-slim + .dockerignore + --no-cache-dir + layered COPY</text>
    
    <!-- Bar Background -->
    <rect x="0" y="42" width="700" height="32" rx="6" fill="#1e293b"/>
    <!-- Filled Bar (165MB / 1280MB * 700px = ~90px) -->
    <rect x="0" y="42" width="90" height="32" rx="6" fill="url(#barAmber)"/>
    <text x="105" y="63" fill="#fbbf24" font-family="monospace" font-weight="800" font-size="15">165 MB</text>
    <text x="210" y="63" fill="#34d399" font-family="sans-serif" font-weight="600" font-size="12">(-87% Azalma)</text>
  </g>

  <!-- Benchmark Bar 3: Multi-Stage Alpine -->
  <g transform="translate(40, 265)">
    <text x="0" y="16" fill="#6ee7b7" font-family="sans-serif" font-weight="700" font-size="13">3. Production Multi-Stage Hardened (Alpine / Distroless)</text>
    <text x="0" y="32" fill="#94a3b8" font-family="sans-serif" font-size="11">Builder stage (derleme) -&gt; Minimal Runtime (UID 10001) + sıfır derleme aracı</text>
    
    <!-- Bar Background -->
    <rect x="0" y="42" width="700" height="32" rx="6" fill="#1e293b"/>
    <!-- Filled Bar (48MB / 1280MB * 700px = ~26px) -->
    <rect x="0" y="42" width="30" height="32" rx="6" fill="url(#barGreen)"/>
    <text x="45" y="63" fill="#34d399" font-family="monospace" font-weight="800" font-size="15">48 MB</text>
    <text x="140" y="63" fill="#34d399" font-family="sans-serif" font-weight="700" font-size="12">(-96% Devasa Tasarruf!)</text>
  </g>
</svg>
