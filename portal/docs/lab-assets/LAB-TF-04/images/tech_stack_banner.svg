<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="100%" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="900" height="120" rx="12" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Brand 1: Terraform -->
  <g transform="translate(30, 25)">
    <rect width="145" height="70" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" filter="url(#shadow)"/>
    <g transform="translate(14, 18)">
      <!-- Terraform Logo -->
      <polygon points="0,0 11,6.5 11,19.5 0,13" fill="#844fba"/>
      <polygon points="13,7.5 24,14 24,27 13,20.5" fill="#5c4ee5"/>
      <polygon points="0,15 11,21.5 11,34.5 0,28" fill="#5c4ee5"/>
      <polygon points="13,22.5 24,29 24,42 13,35.5" fill="#844fba"/>
    </g>
    <text x="48" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14">Terraform</text>
    <text x="48" y="52" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11">IaC Provider</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 185 60 L 205 60" stroke="#64748b" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arrow)"/>

  <!-- Brand 2: Helm -->
  <g transform="translate(215, 25)">
    <rect width="135" height="70" rx="8" fill="#082f49" stroke="#0ea5e9" stroke-width="1.2" filter="url(#shadow)"/>
    <g transform="translate(14, 18)">
      <!-- Helm Wheel Logo -->
      <circle cx="16" cy="18" r="14" fill="none" stroke="#0ea5e9" stroke-width="3"/>
      <circle cx="16" cy="18" r="4" fill="#38bdf8"/>
      <line x1="16" y1="4" x2="16" y2="32" stroke="#38bdf8" stroke-width="2"/>
      <line x1="2" y1="18" x2="30" y2="18" stroke="#38bdf8" stroke-width="2"/>
    </g>
    <text x="50" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14">Helm</text>
    <text x="50" y="52" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11">Package Release</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 360 60 L 380 60" stroke="#64748b" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Brand 3: Kubernetes -->
  <g transform="translate(390, 25)">
    <rect width="145" height="70" rx="8" fill="#172554" stroke="#3b82f6" stroke-width="1.2" filter="url(#shadow)"/>
    <g transform="translate(14, 18)">
      <!-- Kubernetes Logo -->
      <polygon points="16,2 29,10 29,26 16,34 3,26 3,10" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
      <circle cx="16" cy="18" r="5" fill="#60a5fa"/>
    </g>
    <text x="48" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14">Kubernetes</text>
    <text x="48" y="52" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11">kind Cluster</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 545 60 L 565 60" stroke="#64748b" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Brand 4: Prometheus -->
  <g transform="translate(575, 25)">
    <rect width="145" height="70" rx="8" fill="#431407" stroke="#ea580c" stroke-width="1.2" filter="url(#shadow)"/>
    <g transform="translate(14, 16)">
      <!-- Prometheus Flame Logo -->
      <circle cx="15" cy="19" r="14" fill="#ea580c" fill-opacity="0.2"/>
      <path d="M 15 6 Q 19 14 15 22 Q 13 18 10 24 Q 8 30 15 33 Q 23 30 21 21 Q 19 15 15 6 Z" fill="#f97316"/>
    </g>
    <text x="46" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14">Prometheus</text>
    <text x="46" y="52" fill="#fdba74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11">TSDB Metrics</text>
  </g>

  <!-- Arrow 4 -->
  <path d="M 730 60 L 750 60" stroke="#64748b" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Brand 5: Grafana -->
  <g transform="translate(755, 25)">
    <rect width="125" height="70" rx="8" fill="#422006" stroke="#f59e0b" stroke-width="1.2" filter="url(#shadow)"/>
    <g transform="translate(14, 18)">
      <!-- Grafana Logo -->
      <path d="M 8 28 C 4 20 8 10 16 8 C 24 6 28 14 26 22 C 24 28 16 30 8 28 Z" fill="#f59e0b" fill-opacity="0.3"/>
      <circle cx="16" cy="18" r="6" fill="#fbbf24"/>
    </g>
    <text x="46" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14">Grafana</text>
    <text x="46" y="52" fill="#fcd34d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11">Dashboards</text>
  </g>
</svg>
