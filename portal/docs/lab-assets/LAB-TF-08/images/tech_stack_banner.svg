<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 120" width="100%" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="920" height="120" rx="12" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Brand 1: Terraform -->
  <g transform="translate(35, 25)">
    <rect width="150" height="70" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" filter="url(#shadow)"/>
    <g transform="translate(14, 16)">
      <polygon points="0,0 11,6.5 11,19.5 0,13" fill="#844fba"/>
      <polygon points="13,7.5 24,14 24,27 13,20.5" fill="#5c4ee5"/>
      <polygon points="0,15 11,21.5 11,34.5 0,28" fill="#5c4ee5"/>
      <polygon points="13,22.5 24,29 24,42 13,35.5" fill="#844fba"/>
    </g>
    <text x="48" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14">Terraform</text>
    <text x="48" y="52" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11">HCL2 / IaC Core</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 195 60 L 220 60" stroke="#64748b" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Brand 2: AWS VPC & Networking -->
  <g transform="translate(230, 25)">
    <rect width="185" height="70" rx="8" fill="#1c1917" stroke="#f97316" stroke-width="1.2" filter="url(#shadow)"/>
    <g transform="translate(14, 18)">
      <rect width="24" height="24" rx="4" fill="#ea580c"/>
      <path d="M6 12 L12 6 L18 12 L12 18 Z" fill="#ffffff"/>
      <circle cx="12" cy="12" r="2" fill="#ea580c"/>
    </g>
    <text x="48" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14">AWS VPC / CIDR</text>
    <text x="48" y="52" fill="#fdba74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11">Multi-AZ Subnets</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 425 60 L 450 60" stroke="#64748b" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Brand 3: NAT Gateway & IGW -->
  <g transform="translate(460, 25)">
    <rect width="195" height="70" rx="8" fill="#042f2e" stroke="#14b8a6" stroke-width="1.2" filter="url(#shadow)"/>
    <g transform="translate(14, 18)">
      <circle cx="12" cy="12" r="11" fill="#0d9488"/>
      <path d="M8 12 L16 12 M12 8 L16 12 L12 16" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
    <text x="48" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13">IGW &amp; NAT Gateway</text>
    <text x="48" y="52" fill="#5eead4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11">EIP / Egress Control</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 665 60 L 690 60" stroke="#64748b" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Brand 4: Security & Bastion -->
  <g transform="translate(700, 25)">
    <rect width="185" height="70" rx="8" fill="#31102b" stroke="#ec4899" stroke-width="1.2" filter="url(#shadow)"/>
    <g transform="translate(14, 18)">
      <path d="M12 2 L4 6 V12 C4 17 8 21 12 22 C16 21 20 17 20 12 V6 Z" fill="#db2777"/>
      <circle cx="12" cy="11" r="2.5" fill="#ffffff"/>
    </g>
    <text x="46" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13">Security Groups</text>
    <text x="46" y="52" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11">Bastion / Zero Trust</text>
  </g>
</svg>
