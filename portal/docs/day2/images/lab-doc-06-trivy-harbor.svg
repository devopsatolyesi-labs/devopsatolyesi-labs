<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 280" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
  </defs>
  
  <text x="30" y="36" fill="#f8fafc" font-size="18" font-weight="700">LAB-DOC-06 — Trivy Security Gate and Harbor Registry Push</text>
  <text x="30" y="58" fill="#64748b" font-size="12">Automated Build Block on Critical CVEs &amp; Secure OCI Image Storage</text>
  
    <!-- Stage: Stage 1: Build -->
    <g>
      <rect x="30" y="80" width="200" height="160" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="30" y="80" width="200" height="42" rx="10" fill="url(#grad-blue)"/>
      <rect x="30" y="112" width="200" height="10" fill="url(#grad-blue)"/>
      <text x="44" y="106" fill="#ffffff" font-size="14" font-weight="700">Stage 1: Build</text>
      <text x="218" y="106" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="end">Docker Build</text>
      
      <rect x="38" y="132" width="184" height="62" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="46" y="154" fill="#f8fafc" font-size="13" font-weight="600">Application Image</text>
      <rect x="155" y="142" width="65" height="18" rx="9" fill="#1e3a8a"/>
        <text x="188" y="154" fill="#60a5fa" font-size="10" font-weight="600" text-anchor="middle">BUILD</text>
      <text x="46" y="168" fill="#94a3b8" font-size="11">docker build -t app:tag</text>
      
        
    </g>
    
  <path d="M 230 160 L 260 160" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  
    <!-- Stage: Stage 2: Scan -->
    <g>
      <rect x="260" y="80" width="210" height="160" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="260" y="80" width="210" height="42" rx="10" fill="url(#grad-amber)"/>
      <rect x="260" y="112" width="210" height="10" fill="url(#grad-amber)"/>
      <text x="274" y="106" fill="#ffffff" font-size="14" font-weight="700">Stage 2: Scan</text>
      <text x="458" y="106" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="end">CVE Audit</text>
      
      <rect x="268" y="132" width="194" height="62" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="276" y="154" fill="#f8fafc" font-size="13" font-weight="600">Trivy Scanner</text>
      <rect x="395" y="142" width="65" height="18" rx="9" fill="#451a03"/>
        <text x="428" y="154" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">AUDIT</text>
      <text x="276" y="168" fill="#94a3b8" font-size="11">--severity CRITICAL</text>
      
        
    </g>
    
  <path d="M 470 160 L 500 160" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  
    <!-- Stage: Stage 3: Gate -->
    <g>
      <rect x="500" y="80" width="210" height="160" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="500" y="80" width="210" height="42" rx="10" fill="url(#grad-green)"/>
      <rect x="500" y="112" width="210" height="10" fill="url(#grad-green)"/>
      <text x="514" y="106" fill="#ffffff" font-size="14" font-weight="700">Stage 3: Gate</text>
      <text x="698" y="106" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="end">Decision Gate</text>
      
      <rect x="508" y="132" width="194" height="62" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="516" y="154" fill="#f8fafc" font-size="13" font-weight="600">0 CRITICAL</text>
      <rect x="635" y="142" width="65" height="18" rx="9" fill="#064e3b"/>
        <text x="668" y="154" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">PASS</text>
      <text x="516" y="168" fill="#94a3b8" font-size="11">Quality Gate Passed (Exit 0)</text>
      
        
    </g>
    
  <path d="M 710 160 L 740 160" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arrow)"/>
  
    <!-- Stage: Stage 4: Push -->
    <g>
      <rect x="740" y="80" width="190" height="160" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="740" y="80" width="190" height="42" rx="10" fill="url(#grad-purple)"/>
      <rect x="740" y="112" width="190" height="10" fill="url(#grad-purple)"/>
      <text x="754" y="106" fill="#ffffff" font-size="14" font-weight="700">Stage 4: Push</text>
      <text x="918" y="106" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="end">Registry</text>
      
      <rect x="748" y="132" width="174" height="62" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="756" y="154" fill="#f8fafc" font-size="13" font-weight="600">Private Registry</text>
      <rect x="855" y="142" width="65" height="18" rx="9" fill="#3b0764"/>
        <text x="888" y="154" fill="#c084fc" font-size="10" font-weight="600" text-anchor="middle">STORED</text>
      <text x="756" y="168" fill="#94a3b8" font-size="11">docker push :8082</text>
      
        
    </g>
    
    
</svg>