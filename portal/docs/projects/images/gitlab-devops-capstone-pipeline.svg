<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 975 290" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
  </defs>
  
  <text x="30" y="36" fill="#f8fafc" font-size="18" font-weight="700">Project — GitLab CI/CD DevOps Capstone End-to-End Pipeline</text>
  <text x="30" y="58" fill="#64748b" font-size="12">End-to-End Enterprise Delivery: Lint, Test, Package, Security Gate &amp; Deploy</text>
  
    <!-- Stage: Stage 1: Lint -->
    <g>
      <rect x="30" y="80" width="165" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="30" y="80" width="165" height="42" rx="10" fill="url(#grad-cyan)"/>
      <rect x="30" y="112" width="165" height="10" fill="url(#grad-cyan)"/>
      <text x="44" y="106" fill="#ffffff" font-size="14" font-weight="700">Stage 1: Lint</text>
      <text x="183" y="106" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="end">py_compile</text>
      
      <rect x="38" y="132" width="149" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="46" y="154" fill="#f8fafc" font-size="13" font-weight="600">lint-and-validate</text>
      <rect x="120" y="142" width="65" height="18" rx="9" fill="#164e63"/>
        <text x="153" y="154" fill="#22d3ee" font-size="10" font-weight="600" text-anchor="middle">VALID</text>
      <text x="46" y="168" fill="#94a3b8" font-size="11">Syntax Verification</text>
      <text x="46" y="182" fill="#64748b" font-size="10" font-family="monospace">python:3.11-alpine</text>
        
    </g>
    
  <path d="M 195 160 L 215 160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
    <!-- Stage: Stage 2: Test -->
    <g>
      <rect x="215" y="80" width="165" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="215" y="80" width="165" height="42" rx="10" fill="url(#grad-green)"/>
      <rect x="215" y="112" width="165" height="10" fill="url(#grad-green)"/>
      <text x="229" y="106" fill="#ffffff" font-size="14" font-weight="700">Stage 2: Test</text>
      <text x="368" y="106" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="end">Unit Tests</text>
      
      <rect x="223" y="132" width="149" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="231" y="154" fill="#f8fafc" font-size="13" font-weight="600">run-test-suite</text>
      <rect x="305" y="142" width="65" height="18" rx="9" fill="#064e3b"/>
        <text x="338" y="154" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">PASS</text>
      <text x="231" y="168" fill="#94a3b8" font-size="11">test_main.py</text>
      <text x="231" y="182" fill="#64748b" font-size="10" font-family="monospace">python:3.11-alpine</text>
        
    </g>
    
  <path d="M 380 160 L 400 160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
    <!-- Stage: Stage 3: Package -->
    <g>
      <rect x="400" y="80" width="165" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="400" y="80" width="165" height="42" rx="10" fill="url(#grad-blue)"/>
      <rect x="400" y="112" width="165" height="10" fill="url(#grad-blue)"/>
      <text x="414" y="106" fill="#ffffff" font-size="14" font-weight="700">Stage 3: Package</text>
      <text x="553" y="106" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="end">Container</text>
      
      <rect x="408" y="132" width="149" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="416" y="154" fill="#f8fafc" font-size="13" font-weight="600">build-container</text>
      <rect x="490" y="142" width="65" height="18" rx="9" fill="#1e3a8a"/>
        <text x="523" y="154" fill="#60a5fa" font-size="10" font-weight="600" text-anchor="middle">IMAGE</text>
      <text x="416" y="168" fill="#94a3b8" font-size="11">capstone:tag</text>
      <text x="416" y="182" fill="#64748b" font-size="10" font-family="monospace">docker:27.5.1-cli</text>
        
    </g>
    
  <path d="M 565 160 L 585 160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
    <!-- Stage: Stage 4: Security -->
    <g>
      <rect x="585" y="80" width="165" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="585" y="80" width="165" height="42" rx="10" fill="url(#grad-amber)"/>
      <rect x="585" y="112" width="165" height="10" fill="url(#grad-amber)"/>
      <text x="599" y="106" fill="#ffffff" font-size="14" font-weight="700">Stage 4: Security</text>
      <text x="738" y="106" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="end">CVE Gate</text>
      
      <rect x="593" y="132" width="149" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="601" y="154" fill="#f8fafc" font-size="13" font-weight="600">trivy-gate</text>
      <rect x="675" y="142" width="65" height="18" rx="9" fill="#451a03"/>
        <text x="708" y="154" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">AUDITED</text>
      <text x="601" y="168" fill="#94a3b8" font-size="11">Image Vulnerability</text>
      <text x="601" y="182" fill="#64748b" font-size="10" font-family="monospace">trivy:0.74.0</text>
        
    </g>
    
  <path d="M 750 160 L 770 160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
    <!-- Stage: Stage 5: Deploy -->
    <g>
      <rect x="770" y="80" width="175" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="770" y="80" width="175" height="42" rx="10" fill="url(#grad-purple)"/>
      <rect x="770" y="112" width="175" height="10" fill="url(#grad-purple)"/>
      <text x="784" y="106" fill="#ffffff" font-size="14" font-weight="700">Stage 5: Deploy</text>
      <text x="933" y="106" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="end">Smoke &amp; Teardown</text>
      
      <rect x="778" y="132" width="159" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="786" y="154" fill="#f8fafc" font-size="13" font-weight="600">deploy-smoke</text>
      <rect x="870" y="142" width="65" height="18" rx="9" fill="#3b0764"/>
        <text x="903" y="154" fill="#c084fc" font-size="10" font-weight="600" text-anchor="middle">LIVE</text>
      <text x="786" y="168" fill="#94a3b8" font-size="11">run :8090 & /health</text>
      <text x="786" y="182" fill="#64748b" font-size="10" font-family="monospace">after_script: rm -f</text>
        
    </g>
    
    
</svg>