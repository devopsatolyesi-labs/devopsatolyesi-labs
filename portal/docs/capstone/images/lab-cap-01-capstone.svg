<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
  </defs>
  
  <text x="30" y="36" fill="#f8fafc" font-size="18" font-weight="700">LAB-CAP-01 — DevOps Capstone End-to-End Enterprise Architecture</text>
  <text x="30" y="58" fill="#64748b" font-size="12">GitLab/Jenkins CI/CD ➔ Harbor ➔ Argo CD GitOps ➔ K8s Cluster ➔ Prometheus</text>
  
    <!-- Stage: 1. Code &amp; CI -->
    <g>
      <rect x="30" y="80" width="170" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="30" y="80" width="170" height="42" rx="10" fill="url(#grad-blue)"/>
      <rect x="30" y="112" width="170" height="10" fill="url(#grad-blue)"/>
      <text x="44" y="106" fill="#ffffff" font-size="14" font-weight="700">1. Code &amp; CI</text>
      <text x="188" y="106" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="end">CI Pipeline</text>
      
      <rect x="38" y="132" width="154" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="46" y="154" fill="#f8fafc" font-size="13" font-weight="600">Test &amp; Build</text>
      <rect x="125" y="142" width="65" height="18" rx="9" fill="#1e3a8a"/>
        <text x="158" y="154" fill="#60a5fa" font-size="10" font-weight="600" text-anchor="middle">CI OK</text>
      <text x="46" y="168" fill="#94a3b8" font-size="11">Automated pipeline</text>
      
        
    </g>
    
  <path d="M 200 160 L 220 160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
    <!-- Stage: 2. Security -->
    <g>
      <rect x="220" y="80" width="170" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="220" y="80" width="170" height="42" rx="10" fill="url(#grad-amber)"/>
      <rect x="220" y="112" width="170" height="10" fill="url(#grad-amber)"/>
      <text x="234" y="106" fill="#ffffff" font-size="14" font-weight="700">2. Security</text>
      <text x="378" y="106" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="end">Harbor &amp; Trivy</text>
      
      <rect x="228" y="132" width="154" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="236" y="154" fill="#f8fafc" font-size="13" font-weight="600">Vulnerability</text>
      <rect x="315" y="142" width="65" height="18" rx="9" fill="#451a03"/>
        <text x="348" y="154" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">SECURE</text>
      <text x="236" y="168" fill="#94a3b8" font-size="11">0 CVE Gate</text>
      
        
    </g>
    
  <path d="M 390 160 L 410 160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
    <!-- Stage: 3. GitOps -->
    <g>
      <rect x="410" y="80" width="170" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="410" y="80" width="170" height="42" rx="10" fill="url(#grad-green)"/>
      <rect x="410" y="112" width="170" height="10" fill="url(#grad-green)"/>
      <text x="424" y="106" fill="#ffffff" font-size="14" font-weight="700">3. GitOps</text>
      <text x="568" y="106" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="end">Argo CD</text>
      
      <rect x="418" y="132" width="154" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="426" y="154" fill="#f8fafc" font-size="13" font-weight="600">Auto Sync</text>
      <rect x="505" y="142" width="65" height="18" rx="9" fill="#064e3b"/>
        <text x="538" y="154" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">SYNCED</text>
      <text x="426" y="168" fill="#94a3b8" font-size="11">Git repo sync</text>
      
        
    </g>
    
  <path d="M 580 160 L 600 160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
    <!-- Stage: 4. Production -->
    <g>
      <rect x="600" y="80" width="170" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="600" y="80" width="170" height="42" rx="10" fill="url(#grad-purple)"/>
      <rect x="600" y="112" width="170" height="10" fill="url(#grad-purple)"/>
      <text x="614" y="106" fill="#ffffff" font-size="14" font-weight="700">4. Production</text>
      <text x="758" y="106" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="end">K8s Runtime</text>
      
      <rect x="608" y="132" width="154" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="616" y="154" fill="#f8fafc" font-size="13" font-weight="600">Live Cluster</text>
      <rect x="695" y="142" width="65" height="18" rx="9" fill="#3b0764"/>
        <text x="728" y="154" fill="#c084fc" font-size="10" font-weight="600" text-anchor="middle">PROD</text>
      <text x="616" y="168" fill="#94a3b8" font-size="11">Ingress &amp; Pods</text>
      
        
    </g>
    
  <path d="M 770 160 L 790 160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  
    <!-- Stage: 5. Observability -->
    <g>
      <rect x="790" y="80" width="160" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="790" y="80" width="160" height="42" rx="10" fill="url(#grad-rose)"/>
      <rect x="790" y="112" width="160" height="10" fill="url(#grad-rose)"/>
      <text x="804" y="106" fill="#ffffff" font-size="14" font-weight="700">5. Observability</text>
      <text x="938" y="106" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="end">Grafana</text>
      
      <rect x="798" y="132" width="144" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="806" y="154" fill="#f8fafc" font-size="13" font-weight="600">Monitoring</text>
      <rect x="875" y="142" width="65" height="18" rx="9" fill="#4c0519"/>
        <text x="908" y="154" fill="#fb7185" font-size="10" font-weight="600" text-anchor="middle">ALERT</text>
      <text x="806" y="168" fill="#94a3b8" font-size="11">Alerts &amp; Logs</text>
      
        
    </g>
    
    
</svg>