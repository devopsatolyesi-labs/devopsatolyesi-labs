<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 290" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
  </defs>
  
  <text x="30" y="36" fill="#f8fafc" font-size="18" font-weight="700">LAB-GLB-04 — GitLab CI DevSecOps Security Gate &amp; CVE Audit</text>
  <text x="30" y="58" fill="#64748b" font-size="12">Shift-Left Security: Syntax Linting, Static Dependency Scan &amp; Container Image Gate</text>
  
    <!-- Stage: Stage 1: Lint -->
    <g>
      <rect x="30" y="80" width="260" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="30" y="80" width="260" height="42" rx="10" fill="url(#grad-cyan)"/>
      <rect x="30" y="112" width="260" height="10" fill="url(#grad-cyan)"/>
      <text x="44" y="106" fill="#ffffff" font-size="14" font-weight="700">Stage 1: Lint</text>
      <text x="278" y="106" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="end">Static Analysis</text>
      
      <rect x="38" y="132" width="244" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="46" y="154" fill="#f8fafc" font-size="13" font-weight="600">code-lint</text>
      <rect x="215" y="142" width="65" height="18" rx="9" fill="#164e63"/>
        <text x="248" y="154" fill="#22d3ee" font-size="10" font-weight="600" text-anchor="middle">LINT OK</text>
      <text x="46" y="168" fill="#94a3b8" font-size="11">node --check src/index.js</text>
      <text x="46" y="182" fill="#64748b" font-size="10" font-family="monospace">Syntax &amp; Coding Standards</text>
        
    </g>
    
  <path d="M 290 160 L 340 160" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  
    <!-- Stage: Stage 2: Security Scan -->
    <g>
      <rect x="340" y="80" width="260" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="340" y="80" width="260" height="42" rx="10" fill="url(#grad-amber)"/>
      <rect x="340" y="112" width="260" height="10" fill="url(#grad-amber)"/>
      <text x="354" y="106" fill="#ffffff" font-size="14" font-weight="700">Stage 2: Security Scan</text>
      <text x="588" y="106" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="end">Filesystem CVE</text>
      
      <rect x="348" y="132" width="244" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="356" y="154" fill="#f8fafc" font-size="13" font-weight="600">dependency-cve-scan</text>
      <rect x="525" y="142" width="65" height="18" rx="9" fill="#451a03"/>
        <text x="558" y="154" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">CVE: 0</text>
      <text x="356" y="168" fill="#94a3b8" font-size="11">trivy fs --severity HIGH,CRITICAL</text>
      <text x="356" y="182" fill="#64748b" font-size="10" font-family="monospace">aquasec/trivy:0.74.0</text>
        
    </g>
    
  <path d="M 600 160 L 650 160" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  
    <!-- Stage: Stage 3: Container Audit -->
    <g>
      <rect x="650" y="80" width="260" height="180" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="650" y="80" width="260" height="42" rx="10" fill="url(#grad-rose)"/>
      <rect x="650" y="112" width="260" height="10" fill="url(#grad-rose)"/>
      <text x="664" y="106" fill="#ffffff" font-size="14" font-weight="700">Stage 3: Container Audit</text>
      <text x="898" y="106" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="end">Image Quality Gate</text>
      
      <rect x="658" y="132" width="244" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="666" y="154" fill="#f8fafc" font-size="13" font-weight="600">container-image-gate</text>
      <rect x="835" y="142" width="65" height="18" rx="9" fill="#4c0519"/>
        <text x="868" y="154" fill="#fb7185" font-size="10" font-weight="600" text-anchor="middle">GATE PASS</text>
      <text x="666" y="168" fill="#94a3b8" font-size="11">docker build &amp; trivy image</text>
      <text x="666" y="182" fill="#64748b" font-size="10" font-family="monospace">after_script: docker rmi</text>
        
    </g>
    
    
</svg>