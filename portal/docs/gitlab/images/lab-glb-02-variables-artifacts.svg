<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
  </defs>
  
  <text x="30" y="36" fill="#f8fafc" font-size="18" font-weight="700">LAB-GLB-02 — GitLab CI Variables and Artifacts Lifecycle</text>
  <text x="30" y="58" fill="#64748b" font-size="12">Stage Data Transfer, Dependencies Filtering &amp; expire_in Lifecycle</text>
  
    <!-- Stage: Stage 1: Build -->
    <g>
      <rect x="30" y="80" width="260" height="220" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="30" y="80" width="260" height="42" rx="10" fill="url(#grad-blue)"/>
      <rect x="30" y="112" width="260" height="10" fill="url(#grad-blue)"/>
      <text x="44" y="106" fill="#ffffff" font-size="14" font-weight="700">Stage 1: Build</text>
      <text x="278" y="106" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="end">Artifact Generation</text>
      
      <rect x="38" y="132" width="244" height="68" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="46" y="154" fill="#f8fafc" font-size="13" font-weight="600">build-artifacts</text>
      <rect x="215" y="142" width="65" height="18" rx="9" fill="#1e3a8a"/>
        <text x="248" y="154" fill="#93c5fd" font-size="10" font-weight="600" text-anchor="middle">1 HOUR</text>
      <text x="46" y="168" fill="#94a3b8" font-size="11">node index.js (build-info)</text>
      <text x="46" y="182" fill="#64748b" font-size="10" font-family="monospace">artifacts: paths [build-info.txt]</text>
        
      <rect x="38" y="210" width="244" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="46" y="232" fill="#f8fafc" font-size="13" font-weight="600">Variables</text>
      
      <text x="46" y="246" fill="#94a3b8" font-size="11">$CI_COMMIT_SHORT_SHA</text>
      <text x="46" y="260" fill="#64748b" font-size="10" font-family="monospace">$CI_PIPELINE_IID / $APP_VERSION</text>
        
    </g>
    
  <path d="M 290 150 L 340 150" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="315" y="140" fill="#94a3b8" font-size="10" text-anchor="middle">artifacts</text>
  
    <!-- Stage: Stage 2: Test -->
    <g>
      <rect x="340" y="80" width="260" height="220" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="340" y="80" width="260" height="42" rx="10" fill="url(#grad-green)"/>
      <rect x="340" y="112" width="260" height="10" fill="url(#grad-green)"/>
      <text x="354" y="106" fill="#ffffff" font-size="14" font-weight="700">Stage 2: Test</text>
      <text x="588" y="106" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="end">Artifact Verification</text>
      
      <rect x="348" y="132" width="244" height="68" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="356" y="154" fill="#f8fafc" font-size="13" font-weight="600">verify-artifacts</text>
      <rect x="525" y="142" width="65" height="18" rx="9" fill="#064e3b"/>
        <text x="558" y="154" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">PASSED</text>
      <text x="356" y="168" fill="#94a3b8" font-size="11">node test.js (assert file)</text>
      <text x="356" y="182" fill="#64748b" font-size="10" font-family="monospace">dependencies: [build-artifacts]</text>
        
      <rect x="348" y="210" width="244" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="356" y="232" fill="#f8fafc" font-size="13" font-weight="600">Dependencies Filter</text>
      
      <text x="356" y="246" fill="#94a3b8" font-size="11">Only build-artifacts fetched</text>
      <text x="356" y="260" fill="#64748b" font-size="10" font-family="monospace">Clean execution environment</text>
        
    </g>
    
  <path d="M 600 150 L 650 150" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="625" y="140" fill="#94a3b8" font-size="10" text-anchor="middle">verified</text>
  
    <!-- Stage: Stage 3: Package -->
    <g>
      <rect x="650" y="80" width="260" height="220" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="650" y="80" width="260" height="42" rx="10" fill="url(#grad-purple)"/>
      <rect x="650" y="112" width="260" height="10" fill="url(#grad-purple)"/>
      <text x="664" y="106" fill="#ffffff" font-size="14" font-weight="700">Stage 3: Package</text>
      <text x="898" y="106" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="end">Release Packaging</text>
      
      <rect x="658" y="132" width="244" height="68" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="666" y="154" fill="#f8fafc" font-size="13" font-weight="600">package-release</text>
      <rect x="835" y="142" width="65" height="18" rx="9" fill="#3b0764"/>
        <text x="868" y="154" fill="#d8b4fe" font-size="10" font-weight="600" text-anchor="middle">RELEASE</text>
      <text x="666" y="168" fill="#94a3b8" font-size="11">tar -czvf release.tar.gz</text>
      <text x="666" y="182" fill="#64748b" font-size="10" font-family="monospace">artifacts: paths [*.tar.gz]</text>
        
      <rect x="658" y="210" width="244" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="666" y="232" fill="#f8fafc" font-size="13" font-weight="600">Job Artifacts</text>
      
      <text x="666" y="246" fill="#94a3b8" font-size="11">Downloadable from GitLab UI</text>
      <text x="666" y="260" fill="#64748b" font-size="10" font-family="monospace">Deployable distribution package</text>
        
    </g>
    
    
</svg>