<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%" style="background:#0f172a; border-radius:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="grad-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
  </defs>
  
  <text x="30" y="36" fill="#f8fafc" font-size="18" font-weight="700">LAB-ARG-01 — Argo CD Declarative GitOps Synchronization</text>
  <text x="30" y="58" fill="#64748b" font-size="12">Git Repository as the Single Source of Truth Architecture</text>
  
    <!-- Stage: 1. Git Repository -->
    <g>
      <rect x="30" y="80" width="260" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="30" y="80" width="260" height="42" rx="10" fill="url(#grad-blue)"/>
      <rect x="30" y="112" width="260" height="10" fill="url(#grad-blue)"/>
      <text x="44" y="106" fill="#ffffff" font-size="14" font-weight="700">1. Git Repository</text>
      <text x="278" y="106" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="end">Single Source of Truth</text>
      
      <rect x="38" y="132" width="244" height="62" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="46" y="154" fill="#f8fafc" font-size="13" font-weight="600">K8s Manifests</text>
      <rect x="215" y="142" width="65" height="18" rx="9" fill="#1e3a8a"/>
        <text x="248" y="154" fill="#60a5fa" font-size="10" font-weight="600" text-anchor="middle">GIT</text>
      <text x="46" y="168" fill="#94a3b8" font-size="11">Git commit &amp; push</text>
      
        
    </g>
    
  <path d="M 290 155 L 340 155" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="315" y="145" fill="#10b981" font-size="10" text-anchor="middle">polling/webhook</text>
  
    <!-- Stage: 2. Argo CD Server -->
    <g>
      <rect x="340" y="80" width="260" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="340" y="80" width="260" height="42" rx="10" fill="url(#grad-amber)"/>
      <rect x="340" y="112" width="260" height="10" fill="url(#grad-amber)"/>
      <text x="354" y="106" fill="#ffffff" font-size="14" font-weight="700">2. Argo CD Server</text>
      <text x="588" y="106" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="end">Reconciliation Engine</text>
      
      <rect x="348" y="132" width="244" height="62" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="356" y="154" fill="#f8fafc" font-size="13" font-weight="600">Diff Detection</text>
      <rect x="525" y="142" width="65" height="18" rx="9" fill="#451a03"/>
        <text x="558" y="154" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">SYNC</text>
      <text x="356" y="168" fill="#94a3b8" font-size="11">Desired vs Actual State</text>
      
        
    </g>
    
  <path d="M 600 155 L 650 155" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="625" y="145" fill="#c084fc" font-size="10" text-anchor="middle">apply</text>
  
    <!-- Stage: 3. K8s Cluster -->
    <g>
      <rect x="650" y="80" width="260" height="150" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="650" y="80" width="260" height="42" rx="10" fill="url(#grad-purple)"/>
      <rect x="650" y="112" width="260" height="10" fill="url(#grad-purple)"/>
      <text x="664" y="106" fill="#ffffff" font-size="14" font-weight="700">3. K8s Cluster</text>
      <text x="898" y="106" fill="#e2e8f0" font-size="11" font-weight="500" text-anchor="end">Runtime Environment</text>
      
      <rect x="658" y="132" width="244" height="62" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
      <text x="666" y="154" fill="#f8fafc" font-size="13" font-weight="600">Auto Sync &amp; Self-Heal</text>
      <rect x="835" y="142" width="65" height="18" rx="9" fill="#3b0764"/>
        <text x="868" y="154" fill="#c084fc" font-size="10" font-weight="600" text-anchor="middle">HEALTHY</text>
      <text x="666" y="168" fill="#94a3b8" font-size="11">Cluster conforms to Git</text>
      
        
    </g>
    
    
</svg>