<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="100%" height="120">
  <defs>
    <linearGradient id="bgCompose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021428" />
      <stop offset="100%" stop-color="#0f2b48" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="900" height="120" rx="12" fill="url(#bgCompose)" stroke="#1e4976" stroke-width="1.5"/>

  <!-- Badge 1: Docker Compose -->
  <g transform="translate(30, 25)">
    <rect width="170" height="70" rx="8" fill="#0b2440" stroke="#2496ed" stroke-width="1.2" filter="url(#cardShadow)"/>
    <g transform="translate(14, 18)">
      <!-- Docker Whale Logo -->
      <path d="M 28 16 L 24 16 L 24 12 L 28 12 Z M 22 16 L 18 16 L 18 12 L 22 12 Z M 16 16 L 12 16 L 12 12 L 16 12 Z M 22 10 L 18 10 L 18 6 L 22 6 Z M 16 10 L 12 10 L 12 6 L 16 6 Z M 10 16 L 6 16 L 6 12 L 10 12 Z M 2 20 C 3 26 9 30 18 30 C 26 30 32 25 34 18 C 30 18 28 20 25 18 C 24 18 2 18 2 20 Z" fill="#2496ed"/>
    </g>
    <text x="56" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13">Docker Compose</text>
    <text x="56" y="52" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11">Enterprise Patterns</text>
  </g>

  <!-- Divider -->
  <line x1="218" y1="35" x2="218" y2="85" stroke="#1e4976" stroke-width="2"/>

  <!-- Badge 2: YAML Anchors & Extensions -->
  <g transform="translate(235, 25)">
    <rect width="145" height="70" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text x="16" y="32" fill="#a5b4fc" font-family="monospace" font-weight="700" font-size="13">&amp;anchors</text>
    <text x="16" y="48" fill="#c7d2fe" font-family="monospace" font-weight="500" font-size="11">&lt;&lt;: *x-common</text>
    <text x="16" y="62" fill="#e0e7ff" font-family="sans-serif" font-weight="600" font-size="10">DRY Extensions</text>
  </g>

  <!-- Badge 3: Multi-File Overrides -->
  <g transform="translate(395, 25)">
    <rect width="150" height="70" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text x="16" y="32" fill="#6ee7b7" font-family="monospace" font-weight="700" font-size="12">compose.yaml</text>
    <text x="16" y="48" fill="#a7f3d0" font-family="monospace" font-weight="500" font-size="11">+ override.yaml</text>
    <text x="16" y="62" fill="#ecfdf5" font-family="sans-serif" font-weight="600" font-size="10">Multi-Env Layering</text>
  </g>

  <!-- Badge 4: Compose Profiles -->
  <g transform="translate(560, 25)">
    <rect width="145" height="70" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text x="16" y="32" fill="#fcd34d" font-family="monospace" font-weight="700" font-size="12">profiles: [...]</text>
    <text x="16" y="48" fill="#fde68a" font-family="sans-serif" font-weight="500" font-size="11">worker | debug</text>
    <text x="16" y="62" fill="#fffbeb" font-family="sans-serif" font-weight="600" font-size="10">On-Demand Stacks</text>
  </g>

  <!-- Badge 5: Tiered Networks -->
  <g transform="translate(720, 25)">
    <rect width="150" height="70" rx="8" fill="#311042" stroke="#c084fc" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text x="16" y="32" fill="#e9d5ff" font-family="sans-serif" font-weight="700" font-size="12">Dual-Tier Network</text>
    <text x="16" y="48" fill="#f3e8ff" font-family="sans-serif" font-weight="500" font-size="10">Public vs Data Net</text>
    <text x="16" y="62" fill="#d8b4fe" font-family="sans-serif" font-weight="600" font-size="10">Zero-Trust Storage</text>
  </g>
</svg>
