apiVersion: v1
kind: Namespace
metadata:
  name: lab-k8s-08
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: lab-k8s-08-local-pv
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: lab-k8s-08-local
  hostPath:
    path: /tmp/lab-k8s-08
    type: DirectoryOrCreate
