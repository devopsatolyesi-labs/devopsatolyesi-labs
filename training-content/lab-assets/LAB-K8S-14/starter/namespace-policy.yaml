apiVersion: v1
kind: Namespace
metadata:
  name: governed
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: governed
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 100m, memory: 64Mi}
      default: {cpu: 250m, memory: 128Mi}
      max: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-budget
  namespace: governed
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    pods: "4"
    persistentvolumeclaims: "2"
