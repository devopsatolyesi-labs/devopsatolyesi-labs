name: lab-log-01

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.8
    container_name: lab-log-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      bootstrap.memory_lock: "true"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    networks: [logging]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g

  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.8
    container_name: lab-log-logstash
    restart: unless-stopped
    environment:
      LS_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logstash/config/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - logstash-data:/usr/share/logstash/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks: [logging]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9600/_node/pipelines/main?pretty=false | grep -q '\"ephemeral_id\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 1g

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.8
    container_name: lab-log-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_NAME: lab-log-kibana
      TELEMETRY_ENABLED: "false"
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: lab-log-01-egitim-anahtari-en-az-32-karakter
    ports:
      - "0.0.0.0:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks: [logging]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 1500m

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.17.8
    container_name: lab-log-filebeat
    restart: unless-stopped
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./runtime/nginx:/var/log/lab-nginx:ro
      - ${HOST_NGINX_LOG_DIR:-./runtime/host-nginx}:/var/log/host-nginx:ro
      - filebeat-data:/usr/share/filebeat/data
    depends_on:
      logstash:
        condition: service_healthy
    networks: [logging]

  nginx:
    image: nginx:1.27-alpine
    container_name: lab-log-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./runtime/nginx:/var/log/nginx
    ports:
      - "0.0.0.0:8088:80"
    networks: [logging]
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  elasticsearch-data:
  logstash-data:
  filebeat-data:

networks:
  logging:
    driver: bridge
