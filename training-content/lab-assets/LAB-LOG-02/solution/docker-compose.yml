# ==============================================================================
# DevOps Atölyesi — Production-Ready ELK Stack for Centralized Logging
# Elastic Version: 8.17.8 (Latest Stable 8.x)
# Compatible with: Local Platform, Student Environment & Cockpit Web Terminal
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Elasticsearch: Centralized Distributed Search & Storage Engine
  # ----------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.8
    container_name: devops-elasticsearch
    restart: unless-stopped
    environment:
      - node.name=es-node-01
      - cluster.name=devops-logging-cluster
      - discovery.type=single-node
      - xpack.security.enabled=${XPACK_SECURITY_ENABLED:-false}
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - elk-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  # ----------------------------------------------------------------------------
  # 2. Logstash: Log Processing & Transformation Pipeline
  # ----------------------------------------------------------------------------
  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.8
    container_name: devops-logstash
    restart: unless-stopped
    environment:
      - "LS_JAVA_OPTS=-Xms512m -Xmx512m"
      - ENVIRONMENT=production
      - CLUSTER_NAME=devops-platform
      - http.host=0.0.0.0
      - xpack.monitoring.enabled=false
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5044:5044"   # Beats input (Filebeat / Metricbeat)
      - "5000:5000"   # TCP input (Raw JSON stream)
      - "8085:8080"   # HTTP input endpoint (Application logs via HTTP REST)
      - "9600:9600"   # Logstash Monitoring API
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9600/ | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"\\|\"status\":\"ok\"' || exit 0"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ----------------------------------------------------------------------------
  # 3. Kibana: Visualization, Dashboards & Observability UI
  # ----------------------------------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.8
    container_name: devops-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=kibana.devopsatolyesi.local
      - TELEMETRY_ENABLED=false
      - NEWS_ENABLED=false
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:5601/api/status | grep -q '\"overall\":{\"level\":\"available\"}' || exit 0"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 45s

  # ----------------------------------------------------------------------------
  # 4. Filebeat: Lightweight Log Shipper
  # ----------------------------------------------------------------------------
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.17.8
    container_name: devops-filebeat
    restart: unless-stopped
    user: root
    command: filebeat -e --strict.perms=false
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./sample-logs:/var/log/sample-logs:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${KUBERNETES_LOG_DIR:-./sample-kubernetes}:/var/log/kubernetes:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      logstash:
        condition: service_started
    networks:
      - elk-net

  # Linux CPU/RAM/filesystem and Docker runtime metrics.
  metricbeat:
    image: docker.elastic.co/beats/metricbeat:8.17.8
    container_name: devops-metricbeat
    restart: unless-stopped
    user: root
    command: ["metricbeat", "-e", "--strict.perms=false", "-E", "system.hostfs=/hostfs"]
    volumes:
      - ./metricbeat/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
      - /proc:/hostfs/proc:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /:/hostfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - elk-net

  # ----------------------------------------------------------------------------
  # 5. Demo Application: Node.js Order API (Winston Logger)
  # ----------------------------------------------------------------------------
  order-api:
    build:
      context: ./apps/node-order-api
      dockerfile: Dockerfile
    container_name: demo-order-api
    restart: unless-stopped
    environment:
      - PORT=3000
      - SERVICE_NAME=order-api
      - NODE_ENV=production
      - LOG_LEVEL=info
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - LOGSTASH_HTTP_URL=http://logstash:8080
      - LOGSTASH_TCP_HOST=logstash
      - LOGSTASH_TCP_PORT=5000
    ports:
      - "3001:3000"
    depends_on:
      elasticsearch:
        condition: service_healthy
      logstash:
        condition: service_started
    networks:
      - elk-net

  # ----------------------------------------------------------------------------
  # 6. Demo Application: Python Payment Worker (Background Log Generator)
  # ----------------------------------------------------------------------------
  payment-worker:
    build:
      context: ./apps/python-payment-worker
      dockerfile: Dockerfile
    container_name: demo-payment-worker
    restart: unless-stopped
    environment:
      - SERVICE_NAME=payment-worker
      - ENVIRONMENT=production
      - LOGSTASH_TCP_HOST=logstash
      - LOGSTASH_TCP_PORT=5000
      - LOG_INTERVAL_SECONDS=2
    depends_on:
      logstash:
        condition: service_started
    networks:
      - elk-net

volumes:
  es_data:
    name: devops_elk_es_data

networks:
  elk-net:
    name: devops_elk_network
    driver: bridge
