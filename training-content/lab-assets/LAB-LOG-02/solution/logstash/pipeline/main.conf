# ==============================================================================
# DevOps Atölyesi — Production-Grade Logstash Pipeline (main.conf)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. INPUT SECTION
# ------------------------------------------------------------------------------
input {
  # Beats input for Filebeat log shippers (Docker containers, system logs)
  beats {
    port => 5044
    tags => ["beats", "filebeat"]
  }

  # TCP input for structured JSON streams from microservices
  tcp {
    port => 5000
    codec => json_lines
    tags => ["tcp", "structured_json"]
  }

  # HTTP REST endpoint for webhooks and direct HTTP log posting
  http {
    port => 8080
    codec => json
    tags => ["http", "app_rest"]
  }
}

# ------------------------------------------------------------------------------
# 2. FILTER SECTION
# ------------------------------------------------------------------------------
filter {
  # A. Parse raw JSON strings in message field
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "parsed"
      skip_on_invalid_json => true
    }

    # Flatten common parsed fields to top-level if needed
    if [parsed][level] {
      mutate { add_field => { "level" => "%{[parsed][level]}" } }
    }
    if [parsed][service] {
      mutate { add_field => { "service" => "%{[parsed][service]}" } }
    }
    if [parsed][trace_id] {
      mutate { add_field => { "trace_id" => "%{[parsed][trace_id]}" } }
    }
    if [parsed][timestamp] {
      date {
        match => [ "[parsed][timestamp]", "ISO8601", "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd'T'HH:mm:ss.SSSZ" ]
        target => "@timestamp"
      }
    }
  }

  # B. Parse Nginx / Web Server Combined Access Logs
  if [type] == "nginx" or [service] == "nginx" or [message] =~ /HTTP\/[1-2]\.[0-9]/ {
    grok {
      match => {
        "message" => '%{IPORHOST:client_ip} - %{USER:ident} \[%{HTTPDATE:http_timestamp}\] "(?:%{WORD:http_method} %{NOTSPACE:request_path}(?: HTTP/%{NUMBER:http_version})?|%{DATA:raw_request})" %{NUMBER:status:int} (?:%{NUMBER:response_bytes:int}|-) "(?:%{URI:referrer}|-)" "(?:%{DATA:user_agent}|-)"'
      }
      add_tag => ["nginx_parsed"]
      tag_on_failure => ["_grok_nginx_failure"]
    }

    if "nginx_parsed" in [tags] {
      date {
        match => [ "http_timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
        target => "@timestamp"
        remove_field => [ "http_timestamp" ]
      }
    }
  }

  # C. Log Level Normalization
  if [severity] and ![level] {
    mutate { add_field => { "level" => "%{severity}" } }
  }

  if [level] {
    mutate {
      uppercase => [ "level" ]
    }
  } else {
    mutate {
      add_field => { "level" => "INFO" }
    }
  }

  # D. Tag high severity incidents and errors
  if [level] in ["ERROR", "CRITICAL", "FATAL"] or [status] >= 500 {
    mutate {
      add_tag => ["incident_alert"]
    }
  }

  # E. GeoIP Resolution for External IPs
  if [client_ip] and [client_ip] !~ /^(127\.|10\.|172\.(1[6-9]|2[0-9]|3[0-1])\.|192\.168\.)/ {
    geoip {
      source => "client_ip"
      target => "geo"
    }
  }

  # F. Security & Privacy: Sanitize PII & Credentials
  mutate {
    remove_field => [
      "password",
      "passwd",
      "secret",
      "token",
      "authorization",
      "credit_card",
      "card_number",
      "cvv",
      "ssn",
      "api_key"
    ]
  }

  # G. Environment and Metadata Enrichment
  mutate {
    add_field => {
      "environment" => "${ENVIRONMENT:development}"
      "cluster"     => "${CLUSTER_NAME:devops-platform}"
      "pipeline"    => "devops-elk-main"
    }
  }
}

# ------------------------------------------------------------------------------
# 3. OUTPUT SECTION
# ------------------------------------------------------------------------------
output {
  # Primary Output: Elasticsearch Index
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logs-%{+YYYY.MM.dd}"
    action => "create"
  }

  # Debug Output: Formatted stdout for container logs & troubleshooting
  stdout {
    codec => rubydebug {
      metadata => false
    }
  }
}
