apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-demo
  template:
    metadata:
      labels:
        app: config-demo
    spec:
      containers:
      - name: web
        image: nginx:alpine
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: db-credentials
