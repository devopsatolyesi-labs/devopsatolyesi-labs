apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: capstone-backend
  template:
    metadata:
      labels:
        app: capstone-backend
    spec:
      containers:
      - name: backend
        image: hashicorp/http-echo:latest
        args: ["-text=capstone-backend-ok"]
        ports:
        - containerPort: 5678
