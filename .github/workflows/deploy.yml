name: Publish Labs image for Argo CD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - portal/**
      - training-content/**
      - .dockerignore

permissions:
  contents: read

concurrency:
  group: labs-image-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      REGISTRY: harbor.devopsatolyesi.com
      IMAGE: harbor.devopsatolyesi.com/library/labs-portal
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to private Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_ROBOT_USERNAME }}
          password: ${{ secrets.HARBOR_ROBOT_PASSWORD }}
      - name: Build and publish immutable image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          short_tag=${IMAGE_TAG::12}
          docker build --platform linux/amd64 -t "$IMAGE:$short_tag" -f portal/Dockerfile .
          docker push "$IMAGE:$short_tag"
          printf 'IMAGE_TAG=%s\n' "$short_tag" >> "$GITHUB_ENV"
      - uses: azure/setup-helm@v4
      - name: Publish versioned Helm charts for Argo CD
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_ROBOT_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_ROBOT_PASSWORD }}
        run: |
          chart_version="0.1.${GITHUB_RUN_NUMBER}"
          registry_user=$(printf '%s' "$HARBOR_USERNAME" | tr -d '\r\n')
          registry_password=$(printf '%s' "$HARBOR_PASSWORD" | tr -d '\r\n')
          sed -i -E "s/^  tag: .*/  tag: ${IMAGE_TAG}/" charts/labs-portal/values.yaml
          helm package charts/labs-portal --version "$chart_version" --app-version "$IMAGE_TAG" --destination "$RUNNER_TEMP"
          helm package charts/keycloak --version "$chart_version" --destination "$RUNNER_TEMP"
          printf '%s' "$registry_password" | helm registry login "$REGISTRY" --username "$registry_user" --password-stdin
          helm push "$RUNNER_TEMP/devops-atolyesi-labs-portal-${chart_version}.tgz" "oci://$REGISTRY/library"
          helm push "$RUNNER_TEMP/devops-atolyesi-keycloak-${chart_version}.tgz" "oci://$REGISTRY/library"
